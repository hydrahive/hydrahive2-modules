name: Zerlege-Werkstatt Tests

# Die Suite der Zerlege-Werkstatt braucht den Kern (FastAPI, hydrahive.db,
# hydrahive.settings, hydrahive.projects). Deshalb wird das Kern-Repo geholt
# und dessen Abhaengigkeiten installiert. Ohne Core laeuft die Suite nicht.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kern holen
        uses: actions/checkout@v4
        with:
          repository: hydrahive/hydrahive2
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kern-Abhaengigkeiten
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -e core/

      - name: Test-Abhaengigkeiten
        run: python -m pip install --quiet pytest pytest-asyncio bcrypt

      - name: Suite
        run: |
          PYTHONPATH=core/core/src:zerlegewerkstatt \
            python -m pytest zerlegewerkstatt/tests -q --tb=short

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          python -m pip install --quiet ruff
          ruff check --select F --line-length 120 --target-version py312 zerlegewerkstatt/

  frontend:
    name: Frontend (vitest, tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Kern holen
        uses: actions/checkout@v4
        with:
          repository: hydrahive/hydrahive2
          path: core

      - name: Abhaengigkeiten
        run: cd core/frontend && npm ci --no-audit --no-fund

      - name: Modul-Frontend einhaengen
        run: |
          mkdir -p core/frontend/src/modules/zerlegewerkstatt
          cp -r zerlegewerkstatt/frontend/. core/frontend/src/modules/zerlegewerkstatt/

      - name: Vitest
        run: cd core/frontend && npx vitest run src/modules/zerlegewerkstatt/

      - name: TypeScript
        run: cd core/frontend && npx tsc -b
