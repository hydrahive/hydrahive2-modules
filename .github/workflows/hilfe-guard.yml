name: Hilfe-Guard

# Eine nutzersichtbare Modul-Änderung bringt die Hilfe desselben Moduls mit (<modul>/frontend/help/de/*.md),
# oder die PR-Beschreibung begründet „Keine Hilfe nötig: …“.
# Regel und Modus: docs/specs/hilfe-guard.md im Kern-Repo. Start im Warnmodus (28.11.2026).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  hilfe-guard:
    name: Nutzersichtbare Änderung bringt Hilfe mit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: der Guard vergleicht gegen den Merge-Base.
          fetch-depth: 0

      - name: Hilfe-Guard
        # PR-Texte nur über env – nie direkt in run: einsetzen (Script-Injection).
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HILFE_GUARD_MODE: warn
        run: python3 scripts/check_help_updated.py "$BASE_SHA" "$HEAD_SHA"
