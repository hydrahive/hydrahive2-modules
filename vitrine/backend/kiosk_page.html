<!doctype html><html lang="de"><meta charset="utf-8"><title>Statuszentrale</title>
<style>
html,body{margin:0;height:100%;background:#0b1220;color:#e8eef8;font-family:"DejaVu Sans",sans-serif;cursor:default}
body{display:flex;flex-direction:column;box-sizing:border-box;padding:30px 44px;gap:18px;overflow:hidden}
#kopf{text-align:center}#uhr{font-size:150px;font-weight:bold;line-height:1}#datum{font-size:40px;color:#8d9ab0}
#feiertag{font-size:40px;color:#ffd166;min-height:48px}
section{background:#151c2b;border-radius:22px;padding:18px 28px;border:2px solid #24304a}
h2{font-size:34px;margin:0 0 8px;color:#69d7ff;font-weight:normal}
.zahl{font-size:64px;font-weight:bold}.klein{font-size:32px;color:#b7c2d6}
.zeile{font-size:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0}
.reihe{display:flex;gap:34px;align-items:baseline;flex-wrap:wrap}
.ok{color:#5ee08a}.warn{color:#ffd166}.err{color:#ff6b6b}.aus{color:#8d9ab0}
#b-messages{flex:0 1 auto;min-height:0;overflow:hidden}
#bereiche{display:flex;flex-direction:column;gap:18px;min-height:0}
.raum{display:flex;justify-content:space-between;gap:24px;font-size:34px;margin:4px 0}
.raum .werte{color:#e8eef8;white-space:nowrap}.raum.aus,.raum.aus .werte{color:#8d9ab0}.raum.warn .werte{color:#ffd166}
#chat{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
#c-verlauf{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.c-user,.c-hydra{font-size:34px;white-space:pre-wrap;padding:14px 20px;border-radius:18px;max-width:88%}
.c-user{align-self:flex-end;background:#1d3a52}.c-hydra{align-self:flex-start;background:#151c2b;border:2px solid #24304a}
#c-eingabe{font-size:36px;padding:16px 20px;border-radius:16px;border:3px solid #69d7ff;background:#0d1420;color:#e8eef8}
#c-status{font-size:32px;color:#ffd166;min-height:40px}
#zu-voll{font-size:32px;color:#8d9ab0;text-align:center}
#offline{display:none;font-size:44px;color:#ff6b6b;text-align:center;padding:26px}
body.offline #offline{display:block}body.offline section{opacity:.35}
#kaputt{display:none;font-size:34px;color:#ffb86b;text-align:center;padding:20px}body.kaputt #kaputt{display:block}
#unten{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}
#knubbel{display:flex;gap:6px}
#knubbel button{font-size:44px;line-height:1;min-width:72px;min-height:72px;padding:0;border:none;background:none;color:#69d7ff}
button{font-size:48px;padding:24px 60px;border-radius:20px;border:3px solid #69d7ff;background:#151c2b;color:#e8eef8}
.meldung{border-left:10px solid #69d7ff;padding:6px 0 10px 18px;margin:10px 0}
.meldung.error{border-color:#ff6b6b}.meldung.warning{border-color:#ffd166}.meldung.success{border-color:#5ee08a}
.mkopf{display:flex;justify-content:space-between;align-items:center;gap:18px}
.mtitel{font-size:36px;font-weight:bold}
.mtext{font-size:32px;color:#d6deeb;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meldung button{font-size:32px;padding:12px 30px;border-width:2px;flex:none}
</style>
<div id="kopf"><div id="uhr"></div><div id="datum"></div><div id="feiertag"></div></div>
<div id="offline">HydraHive antwortet nicht</div>
<div id="kaputt">Anzeige wird neu geladen …</div>
<div id="bereiche">
<section id="b-messages"><h2 id="m-kopf">Neu</h2><div id="m-neu"></div><div class="klein" id="m-mehr"></div>
  <div id="m-verlauf-box"><h2>Verlauf (24 h)</h2><div id="m-verlauf"></div></div></section>
<section id="b-home"><h2>Zuhause</h2><div id="z-list"></div></section>
<section id="b-hydra"><h2>Hydra</h2><div class="reihe"><span class="zahl" id="h-agents"></span><span class="klein">Agenten laufen</span>
  <span class="zahl" id="h-errors"></span><span class="klein">Fehler (1 h)</span><span class="klein" id="h-service"></span></div>
  <div id="h-list"></div></section>
<section id="b-tasks"><h2>Aufgaben</h2><div class="reihe"><span class="zahl" id="t-open"></span><span class="klein">offen</span>
  <span class="zahl" id="t-run"></span><span class="klein">laufen</span></div><div id="t-list"></div></section>
<section id="b-github"><h2>Wartet auf Till</h2><div id="g-list"></div></section>
<section id="b-mining"><h2>Mining</h2><div class="reihe"><span class="zahl" id="mi-eur"></span><span class="klein">€/Tag jetzt</span></div>
  <div class="klein" id="mi-rigs"></div></section>
<section id="b-machine"><h2>Rechner</h2><div class="reihe klein" id="r-werte"></div><div class="klein" id="r-mining"></div></section>
</div>
<div id="chat" style="display:none"><div id="c-verlauf"></div><div id="c-status"></div>
  <input id="c-eingabe" maxlength="2000" autocomplete="off" placeholder="Einfach lostippen … (Enter schickt)"></div>
<div id="bt" style="display:none"><h2>Bluetooth</h2><button id="bt-scan">Gerät koppeln</button><div id="bt-hinweis"></div>
  <div id="bt-code"></div><div id="bt-liste"></div><button id="bt-mehr" style="display:none"></button><div id="bt-weitere"></div></div>
<div id="zu-voll"></div>
<div id="unten"><span class="klein" id="stand"></span><nav id="knubbel"></nav><button id="zurueck">Zurück zum Video</button></div>
<script>
"use strict";
const k = "__KEY__";
const PAGE_VERSION = "__VERSION__";
const $ = (id) => document.getElementById(id);
function line(parent, text, cls) {
  const d = document.createElement("div");
  d.className = "zeile" + (cls ? " " + cls : "");
  d.textContent = text;
  parent.appendChild(d);
}
function fill(id, items, fmt) {
  const el = $(id);
  el.replaceChildren();
  for (const it of items) { const [t, c] = fmt(it); line(el, t, c); }
}
function area(name, v) { $("b-" + name).style.display = v == null ? "none" : ""; return v != null; }
function meldung(m) {
  const box = document.createElement("div");
  box.className = "meldung " + (m.kind || "info");
  const kopf = document.createElement("div"); kopf.className = "mkopf";
  const t = document.createElement("span"); t.className = "mtitel";
  t.textContent = m.time + "  " + (m.title || LABEL[m.kind] || "Info") + (m.count > 1 ? "  ×" + m.count : "");
  const b = document.createElement("button"); b.textContent = "Gelesen";
  b.onclick = () => gelesen(m.id, b);
  kopf.append(t, b);
  const x = document.createElement("div"); x.className = "mtext"; x.textContent = m.text;
  box.append(kopf, x);
  return box;
}
async function gelesen(id, b) {
  b.disabled = true;
  try { await fetch("read?k=" + encodeURIComponent(k), {method: "POST", headers: {"Content-Type": "application/json"},
                                                      body: JSON.stringify({id: id})}); } catch (e) { /* nächstes Laden zeigt den Stand */ }
  load();
}
function renderMessages(ms) {
  $("m-kopf").textContent = ms.new_count ? "Neu (" + ms.new_count + ")" : "Meldungen";
  const neu = $("m-neu"); neu.replaceChildren();
  if (!ms.new.length) line(neu, "Keine neuen Meldungen", "ok");
  for (const m of ms.new) neu.appendChild(meldung(m));
  const mehr = ms.new_count - ms.new.length;  // new ist schon auf messages_max gekürzt (Server)
  $("m-mehr").textContent = mehr > 0 ? "+ " + mehr + " weitere" : "";
  $("m-verlauf-box").style.display = ms.history.length ? "" : "none";
  fill("m-verlauf", ms.history, (m) => [m.time + "  " + (m.title ? m.title + ": " : "") + m.text, "aus"]);
}
const LABEL = {info: "Info", success: "Erledigt", warning: "Warnung", error: "Fehler"};
const CI = {green: ["✓ CI grün", "ok"], red: ["✗ CI rot", "err"], running: ["… CI läuft", "warn"], none: ["– keine CI", "aus"]};
const PRIO = {high: "‼", medium: "•", low: "·"};
function render(d) {
  $("feiertag").textContent = d.holiday || "";
  if (area("messages", d.messages)) renderMessages(d.messages);
  if (area("hydra", d.hydra)) {
    $("h-agents").textContent = d.hydra.agents;
    $("h-errors").textContent = d.hydra.errors_last_hour;
    $("h-errors").className = "zahl " + (d.hydra.errors_last_hour ? "err" : "ok");
    $("h-service").textContent = d.hydra.service === "active" ? "Dienst läuft" : "Dienst: " + d.hydra.service;
    $("h-service").className = "klein " + (d.hydra.service === "active" ? "ok" : "err");
    fill("h-list", d.hydra.errors, (e) => [e.source + " ×" + e.count + ": " + e.last, "err"]);
  }
  if (area("tasks", d.tasks)) {
    $("t-open").textContent = d.tasks.open; $("t-run").textContent = d.tasks.in_progress;
    fill("t-list", d.tasks.top, (t) => [(PRIO[t.priority] || "·") + " " + t.title, t.status === "in_progress" ? "warn" : ""]);
  }
  if (area("github", d.github)) {
    const g = d.github.error ? [d.github.error] : [];
    if (!d.github.prs.length) fill("g-list", g.length ? g : ["Nichts offen ✓"], (t) => [t, g.length ? "aus" : "ok"]);
    else fill("g-list", d.github.prs, (p) => [
      p.repo.replace("hydrahive2-", "") + " #" + p.number + " " + CI[p.ci][0] + (p.mergeable === false ? " · Konflikt" : "")
        + (p.draft ? " · Entwurf" : "") + " — " + p.title,
      p.mergeable === false ? "err" : CI[p.ci][1]]);
    if (d.github.prs.length && g.length) line($("g-list"), g[0], "aus");
  }
  const lay = d.layout || {}, inMachine = lay.mining_in_machine !== false;
  const eur = (mi) => mi.eur_day == null ? "–" : mi.eur_day.toFixed(2).replace(".", ",");
  const rigs = (mi) => mi.rigs.map((r) => (r.mining ? "● " : "○ ") + r.name).join("   ");
  if (area("mining", inMachine ? null : d.mining)) { $("mi-eur").textContent = eur(d.mining); $("mi-rigs").textContent = rigs(d.mining); }
  if (area("machine", d.machine)) {
    const m = d.machine, w = [];
    w.push("Last " + m.load); if (m.ram != null) w.push("RAM " + m.ram + " %"); if (m.gpu != null) w.push("GPU " + m.gpu + " °C");
    w.push("frei " + m.disk_free_pct + " %"); w.push("läuft " + m.uptime_h + " h");
    $("r-werte").textContent = w.join("   ·   ");
    $("r-mining").textContent = inMachine && d.mining ? "Mining " + eur(d.mining) + " €/Tag   " + rigs(d.mining) : "";
  }
  if (area("home", d.home)) renderHome(d.home);
  $("stand").textContent = "Stand " + d.updated;
  arrange(lay);
}
function renderHome(h) {
  const el = $("z-list"); el.replaceChildren();
  if (h.error) return line(el, h.error, "aus");
  if (!h.rooms.length) return line(el, "Keine Favoriten im Home-Assistant-Modul", "aus");
  for (const r of h.rooms) {
    const row = document.createElement("div");
    const vals = r.offline_h != null ? ["nicht erreichbar seit " + r.offline_h + " h"]
      : [r.temp, r.hum, r.extra, r.battery_low ? "Batterie " + r.battery_low : null].filter(Boolean);
    row.className = "raum" + (r.offline_h != null ? " aus" : r.battery_low ? " warn" : "");
    const n = document.createElement("span"); n.textContent = r.room;
    const v = document.createElement("span"); v.className = "werte"; v.textContent = vals.join("   ");
    row.append(n, v); el.appendChild(row);
  }
}
// S5: feste Seiten. Belegt = Bereich eingeschaltet und mit Daten (area() hat ihn nicht versteckt). Nie selbst blättern;
// nach der Rückkehrzeit ohne Eingabe zurück auf Seite 1 (Statuszentrale startet nach dem Video wieder vorn).
let curPage = 1, lastInput = Date.now();
for (const ev of ["mousemove", "mousedown", "keydown"]) document.addEventListener(ev, () => { lastInput = Date.now(); });
function arrange(lay) {
  const box = $("bereiche"), hidden = new Set(lay.hidden || []), pages = lay.pages || {}, order = lay.order || [];
  for (const id of order) { const s = $("b-" + id); box.insertBefore(s, null); }
  for (const id of hidden) $("b-" + id).style.display = "none";
  const pageOf = (id) => pages[id] || 1;
  const used = [...new Set(order.filter((id) => $("b-" + id).style.display !== "none").map(pageOf))].sort();
  if (Date.now() - lastInput > (lay.return_seconds || 120) * 1000) {
    curPage = 1; if (chatOn && !chatSending) chatShow(false); if (btOn && !btBusy()) btShow(false);
  }
  if (chatOn && !chatEnabled(lay)) chatShow(false);
  if (btOn && !btEnabled(lay)) btShow(false);
  if (!used.includes(curPage)) curPage = used.length ? used[0] : 1;
  for (const id of order) if (pageOf(id) !== curPage) $("b-" + id).style.display = "none";
  knubbel(used, chatEnabled(lay), btEnabled(lay));
  if (chatOn || btOn) { for (const id of order) $("b-" + id).style.display = "none"; $("zu-voll").style.display = "none"; return; }
  // nie zu voll – je Seite: von unten ganze Bereiche ausblenden, bis alles passt. Platz = Bildschirm − Rand (2×30)
  // − Kopf − Fußzeile − Abstände (body gap 18). Der Hinweis braucht nur Platz, wenn etwas fehlt.
  const GAP = 18, NOTE = 38;
  const shown = () => order.filter((id) => $("b-" + id).style.display !== "none");
  const total = () => shown().reduce((sum, id, i) => sum + $("b-" + id).getBoundingClientRect().height + (i ? GAP : 0), 0);
  const room = window.innerHeight - 60 - $("kopf").getBoundingClientRect().height - $("unten").getBoundingClientRect().height - 3 * GAP;
  let cut = 0;
  while (shown().length > 1 && total() > room - (cut ? NOTE + GAP : 0)) {
    $("b-" + shown().pop()).style.display = "none"; cut += 1;
  }
  $("zu-voll").style.display = cut ? "" : "none";
  $("zu-voll").textContent = cut ? cut + (cut === 1 ? " Bereich" : " Bereiche") + " ausgeblendet (zu voll)" : "";
}
function knubbel(used, withChat, withBt) {
  const nav = $("knubbel"); nav.replaceChildren();
  const n = used.length + (withChat ? 1 : 0) + (withBt ? 1 : 0);
  nav.style.display = n > 1 ? "" : "none";
  if (n < 2) return;
  for (const p of used) {
    const b = document.createElement("button");
    b.textContent = !chatOn && !btOn && p === curPage ? "●" : "○";
    b.title = "Seite " + p;
    b.onclick = () => { curPage = p; lastInput = Date.now(); btShow(false); chatShow(false); };
    nav.appendChild(b);
  }
  if (withBt) {                                          // S7: vor „Chat“
    const b = document.createElement("button");
    b.textContent = btOn ? "●" : "Bluetooth";
    b.title = "Bluetooth-Geräte koppeln";
    b.onclick = () => { lastInput = Date.now(); btShow(true); };
    nav.appendChild(b);
  }
  if (withChat) {
    const c = document.createElement("button");
    c.textContent = chatOn ? "●" : "Chat";
    c.title = "Chat mit Hydra";
    c.onclick = () => { lastInput = Date.now(); btShow(false); chatShow(true); };
    nav.appendChild(c);
  }
}
let busy = false, lastData = null;
// Seite selbst neu laden, wenn ein Update sie geändert hat (Version in /data ≠ eigene) oder render() wiederholt scheitert.
// Fund 20.10.2026: Nach einem Update war die Seite gemischt (neues HTML ohne Chat-Skript). render() warf jedes Mal, und
// die Seite zeigte 18 h „antwortet nicht“, obwohl /data 200 lieferte. Höchstens einmal pro Minute (sessionStorage),
// damit eine kaputte Seite nicht in einer Dauerschleife neu lädt. Netzfehler bleiben „antwortet nicht“, ohne Neuladen.
const RELOAD_GAP_MS = 60000, RENDER_FAILS_MAX = 3;
let renderFails = 0;
function reloadPage() {
  let last = 0;
  try { last = Number(sessionStorage.getItem("vitrine-reload") || 0); } catch (e) { /* ohne Speicher: trotzdem bremsen */ }
  if (Date.now() - last < RELOAD_GAP_MS) return false;
  try { sessionStorage.setItem("vitrine-reload", String(Date.now())); } catch (e) { /* egal */ }
  location.reload();
  return true;
}
async function load() {
  if (busy) return;
  busy = true;
  let d;
  try {
    const r = await fetch("data?k=" + encodeURIComponent(k), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch (e) {
    document.body.classList.add("offline");
    busy = false;
    return;
  }
  document.body.classList.remove("offline");
  try {
    if (d.page_version && d.page_version !== PAGE_VERSION && reloadPage()) return;
    lastData = d;
    render(d);
    renderFails = 0;
    document.body.classList.remove("kaputt");
  } catch (e) {
    renderFails += 1;
    document.body.classList.add("kaputt");
    if (renderFails >= RENDER_FAILS_MAX) reloadPage();
  } finally { busy = false; }
}
function tick() {
  const d = new Date();
  $("uhr").textContent = d.toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"});
  $("datum").textContent = d.toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long"});
}
tick(); setInterval(tick, 1000);
load(); setInterval(load, 5000);
$("zurueck").onclick = () => fetch("back?k=" + encodeURIComponent(k), {method: "POST"});
</script></html>
