# HydraHive Probe M0e (Vitrine-Multiseat): seat0 = AMD (Hauptgrafik) + EVDI als GPU-Device (modesetting, kmsdev).
# Nur für seat0 (MatchSeat). Wird nach spätestens 4 Minuten automatisch entfernt (hh-m0-rueckbau4).
Section "ServerLayout"
    Identifier "hh-m0-seat0"
    MatchSeat  "seat0"
    Screen     "hh-m0-amd"
EndSection
Section "Device"
    Identifier "hh-m0-amd"
    Driver     "amdgpu"
    BusID      "PCI:13:0:0"
    MatchSeat  "seat0"
EndSection
Section "Device"
    Identifier "hh-m0-evdi"
    Driver     "modesetting"
    Option     "kmsdev" "/dev/dri/card1"
    MatchSeat  "seat0"
EndSection
Section "Screen"
    Identifier "hh-m0-amd"
    Device     "hh-m0-amd"
    GPUDevice  "hh-m0-evdi"
    MatchSeat  "seat0"
EndSection
